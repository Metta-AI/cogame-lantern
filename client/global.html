<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lantern &mdash; spectator</title>
<!--
  The live spectator page, served at /client/global.

  It is a spectator surface, so nothing is hidden: it draws the whole floor,
  both trios and every crate off the /global snapshot, including the cogs the
  seekers cannot see. It is what you get while an episode is actually
  running (the hosted replay afterwards is the static wasm bundle), and it is
  one of the two HTTP routes the platform's episode runner requires
  (/client/player is the other).

  It draws with the SAME broadcast_core.js as the replay viewer, on the main
  thread: the snapshot carries the frame packet the wasm module would have
  produced (`frame`), the blueprint + lantern numbers (`meta`) and the
  seekers' lit set bit-packed (`lit_b64`), so racks, paintbot cog rigs and
  sim-exact light occlusion are identical live and in the replay.
-->
<style>
  :root { --paper:#f2e8d8; --moth:#f2c14e; --owl:#4ecdc4; --ink:#2a1f16; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #120d09; color: var(--paper);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
  #wrap { display: flex; flex-direction: column; height: 100%; }
  #bar { display: flex; gap: 14px; align-items: baseline; padding: 8px 12px;
    background: rgba(20,14,9,0.85); border-bottom: 1px solid rgba(242,232,216,0.16);
    font-size: 13px; white-space: nowrap; overflow: hidden; }
  #bar .moth { color: var(--moth); } #bar .owl { color: var(--owl); }
  #bar .act { letter-spacing: 2px; color: #e8a33d; }
  #bar .grow { flex: 1 1 auto; }
  #boardwrap { flex: 1 1 auto; position: relative; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #feed { height: 132px; overflow: hidden; padding: 6px 12px; font-size: 12px;
    line-height: 1.5; background: rgba(20,14,9,0.7);
    border-top: 1px solid rgba(242,232,216,0.16); }
  #feed div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #status { padding: 6px 12px; font-size: 12px; color: #8a7f72; }
</style>
</head>
<body>
<div id="wrap">
  <div id="bar">
    <span class="act" id="act">&mdash;</span>
    <span id="clock">0:00</span>
    <span class="moth" id="moth">Moth 0.0s</span>
    <span class="owl" id="owl">Owl 0.0s</span>
    <span class="grow"></span>
    <span id="turn">turn 0</span>
  </div>
  <div id="boardwrap"><canvas id="board"></canvas></div>
  <div id="feed"></div>
  <div id="status">connecting&hellip;</div>
</div>
<script src="/client/broadcast_core.js"></script>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('board');
  var feed = [];
  var lastSay = {};
  var metaSent = false;
  var core = window.BroadcastCore.create({
    canvas: canvas,
    viewportWidth: 960, viewportHeight: 540,
    devicePixelRatio: window.devicePixelRatio || 1,
    artBase: '/client/art'
  });

  function fit() {
    var rect = canvas.parentNode.getBoundingClientRect();
    core.setViewportSize(Math.max(1, rect.width), Math.max(1, rect.height),
                         window.devicePixelRatio || 1);
  }

  function unpackLit(b64, cells) {
    var raw = atob(b64);
    var out = new Uint8Array(cells);
    for (var i = 0; i < cells; i++) {
      out[i] = (raw.charCodeAt(i >> 3) >> (i & 7)) & 1;
    }
    return out;
  }

  function pushFeed(line) {
    feed.push(line);
    while (feed.length > 7) feed.shift();
    var host = document.getElementById('feed');
    host.textContent = '';
    feed.forEach(function (text) {
      var row = document.createElement('div');
      row.textContent = text;              // names are data: textContent only
      host.appendChild(row);
    });
  }

  function render(state) {
    var hiddenMoth = 0, hiddenOwl = 0;
    (state.cogs || []).forEach(function (cog) {
      if (cog.team === 'Moth') hiddenMoth += cog.hidden_ticks;
      else hiddenOwl += cog.hidden_ticks;
      var key = cog.alias + '|' + cog.say;
      if (cog.say && !lastSay[key]) {
        lastSay[key] = true;
        pushFeed(cog.alias + ' says "' + cog.say + '"');
      }
    });
    document.getElementById('act').textContent =
      'H' + state.half + ' ' + String(state.act).toUpperCase();
    var left = Math.max(0, Math.round(state.act_left_ticks / 24));
    document.getElementById('clock').textContent =
      Math.floor(left / 60) + ':' + ('0' + (left % 60)).slice(-2);
    document.getElementById('moth').textContent =
      'Moth ' + (hiddenMoth / 24).toFixed(1) + 's';
    document.getElementById('owl').textContent =
      'Owl ' + (hiddenOwl / 24).toFixed(1) + 's';
    document.getElementById('turn').textContent =
      'turn ' + (state.turn + 1) + '/' + state.turns;
    if (state.meta && !metaSent) {
      metaSent = true;
      core.ingest(JSON.stringify(state.meta));
    }
    if (state.frame) core.ingest(JSON.stringify(state.frame));
    var grid = state.meta && state.meta.lit_grid;
    if (state.lit_b64 && grid) {
      core.setLitMask(unpackLit(state.lit_b64, grid[0] * grid[1]),
                      grid[0], grid[1], grid[2]);
    }
  }

  function connect() {
    var scheme = location.protocol === 'https:' ? 'wss' : 'ws';
    var base = location.pathname.replace(/\/clients?\/[^/]*$/, '');
    var socket = new WebSocket(scheme + '://' + location.host + base + '/global');
    socket.onopen = function () {
      document.getElementById('status').textContent = 'live';
    };
    socket.onmessage = function (event) {
      try { render(JSON.parse(event.data)); } catch (error) { /* ignore */ }
    };
    socket.onclose = function () {
      document.getElementById('status').textContent =
        'episode over (socket closed)';
    };
    socket.onerror = function () {
      document.getElementById('status').textContent = 'socket error';
    };
  }

  window.addEventListener('resize', fit);
  fit();
  core.start();
  connect();
})();
</script>
</body>
</html>
