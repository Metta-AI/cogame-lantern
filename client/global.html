<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lantern &mdash; spectator</title>
<!--
  The live spectator page, served at /client/global.

  It is a spectator surface, so nothing is hidden: it draws the whole floor,
  both trios and every crate off the /global snapshot, including the cogs the
  seekers cannot see. The hosted broadcast is the STATIC WASM BUNDLE, never
  this page — this is what you get while an episode is actually running, and
  it is one of the two HTTP routes the platform's episode runner requires
  (/client/player is the other).
-->
<style>
  :root { --paper:#f2e8d8; --moth:#f2c14e; --owl:#4ecdc4; --ink:#2a1f16; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #120d09; color: var(--paper);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
  #wrap { display: flex; flex-direction: column; height: 100%; }
  #bar { display: flex; gap: 14px; align-items: baseline; padding: 8px 12px;
    background: rgba(20,14,9,0.85); border-bottom: 1px solid rgba(242,232,216,0.16);
    font-size: 13px; white-space: nowrap; overflow: hidden; }
  #bar .moth { color: var(--moth); } #bar .owl { color: var(--owl); }
  #bar .act { letter-spacing: 2px; color: #e8a33d; }
  #bar .grow { flex: 1 1 auto; }
  #boardwrap { flex: 1 1 auto; position: relative; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #feed { height: 132px; overflow: hidden; padding: 6px 12px; font-size: 12px;
    line-height: 1.5; background: rgba(20,14,9,0.7);
    border-top: 1px solid rgba(242,232,216,0.16); }
  #feed div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #status { padding: 6px 12px; font-size: 12px; color: #8a7f72; }
</style>
</head>
<body>
<div id="wrap">
  <div id="bar">
    <span class="act" id="act">&mdash;</span>
    <span id="clock">0:00</span>
    <span class="moth" id="moth">Moth 0.0s</span>
    <span class="owl" id="owl">Owl 0.0s</span>
    <span class="grow"></span>
    <span id="turn">turn 0</span>
  </div>
  <div id="boardwrap"><canvas id="board"></canvas></div>
  <div id="feed"></div>
  <div id="status">connecting&hellip;</div>
</div>
<script>
(function () {
  'use strict';
  var MAP_W = 1235, MAP_H = 659;
  var canvas = document.getElementById('board');
  var context = canvas.getContext('2d');
  var state = null;
  var feed = [];
  var lastSay = {};

  function fit() {
    var rect = canvas.parentNode.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, Math.round(rect.width * dpr));
    canvas.height = Math.max(1, Math.round(rect.height * dpr));
    draw();
  }

  function teamColour(team) { return team === 'Moth' ? '#f2c14e' : '#4ecdc4'; }

  function draw() {
    if (!canvas.width) return;
    var scale = Math.min(canvas.width / MAP_W, canvas.height / MAP_H);
    context.setTransform(1, 0, 0, 1, 0, 0);
    context.fillStyle = '#0c0906';
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.setTransform(scale, 0, 0, scale,
      (canvas.width - MAP_W * scale) / 2, (canvas.height - MAP_H * scale) / 2);
    context.fillStyle = '#171310';
    context.fillRect(0, 0, MAP_W, MAP_H);
    if (!state) return;
    (state.map.walls || []).forEach(function (w) {
      context.fillStyle = '#2c231b';
      context.fillRect(w[0], w[1], w[2], w[3]);
    });
    var pen = state.map.pen;
    if (pen) {
      context.strokeStyle = 'rgba(78,205,196,0.35)';
      context.lineWidth = 2;
      context.strokeRect(pen[0], pen[1], pen[2], pen[3]);
    }
    (state.crates || []).forEach(function (crate) {
      if (crate.state === 'broken') {
        context.strokeStyle = 'rgba(150,118,82,0.5)';
        context.lineWidth = 3;
        context.beginPath();
        context.moveTo(crate.pos[0] - 20, crate.pos[1] - 8);
        context.lineTo(crate.pos[0] + 20, crate.pos[1] + 6);
        context.stroke();
        return;
      }
      context.fillStyle = crate.state === 'locked' ? '#8a6a3c' : '#7b5c35';
      context.fillRect(crate.pos[0] - 24, crate.pos[1] - 24, 48, 48);
      context.strokeStyle = '#18110b';
      context.lineWidth = 2;
      context.strokeRect(crate.pos[0] - 23, crate.pos[1] - 23, 46, 46);
      if (crate.state === 'locked') {
        context.fillStyle = '#d8c08a';
        [[-14, -14], [14, -14], [-14, 14], [14, 14]].forEach(function (p) {
          context.beginPath();
          context.arc(crate.pos[0] + p[0], crate.pos[1] + p[1], 3, 0, Math.PI * 2);
          context.fill();
        });
      }
    });
    (state.sounds || []).forEach(function (ring) {
      var age = ring.age_ticks / 24;
      context.strokeStyle = 'rgba(232,163,61,' + Math.max(0, 0.45 * (1 - age)) + ')';
      context.lineWidth = ring.kind === 'break' ? 4 : 2;
      context.setLineDash(ring.kind === 'step' ? [8, 8] : []);
      context.beginPath();
      context.arc(ring.pos[0], ring.pos[1], ring.radius * (0.3 + age * 0.7), 0, Math.PI * 2);
      context.stroke();
      context.setLineDash([]);
    });
    (state.cogs || []).forEach(function (cog) {
      var colour = teamColour(cog.team);
      if (cog.role === 'seeker' && state.act === 'hunt') {
        var heading = -cog.aim * Math.PI * 2 / 256;
        var half = 18 * Math.PI * 2 / 256;
        var glow = context.createRadialGradient(
          cog.pos[0], cog.pos[1], 8, cog.pos[0], cog.pos[1], 420);
        glow.addColorStop(0, 'rgba(255,246,214,0.34)');
        glow.addColorStop(1, 'rgba(255,246,214,0)');
        context.fillStyle = glow;
        context.beginPath();
        context.moveTo(cog.pos[0], cog.pos[1]);
        context.arc(cog.pos[0], cog.pos[1], 420, heading - half, heading + half);
        context.closePath();
        context.fill();
      }
      context.globalAlpha = cog.found ? 0.3 : 1;
      context.fillStyle = colour;
      context.beginPath();
      context.arc(cog.pos[0], cog.pos[1], 9, 0, Math.PI * 2);
      context.fill();
      context.globalAlpha = 1;
      context.fillStyle = 'rgba(242,232,216,0.85)';
      context.font = '11px sans-serif';
      context.textAlign = 'center';
      context.fillText(cog.alias, cog.pos[0], cog.pos[1] - 14);
    });
  }

  function pushFeed(line) {
    feed.push(line);
    while (feed.length > 7) feed.shift();
    var host = document.getElementById('feed');
    host.textContent = '';
    feed.forEach(function (text) {
      var row = document.createElement('div');
      row.textContent = text;              // names are data: textContent only
      host.appendChild(row);
    });
  }

  function render(snapshot) {
    state = snapshot;
    var hiddenMoth = 0, hiddenOwl = 0;
    (state.cogs || []).forEach(function (cog) {
      if (cog.team === 'Moth') hiddenMoth += cog.hidden_ticks;
      else hiddenOwl += cog.hidden_ticks;
      var key = cog.alias + '|' + cog.say;
      if (cog.say && !lastSay[key]) {
        lastSay[key] = true;
        pushFeed(cog.alias + ' says "' + cog.say + '"');
      }
    });
    document.getElementById('act').textContent =
      'H' + state.half + ' ' + String(state.act).toUpperCase();
    var left = Math.max(0, Math.round(state.act_left_ticks / 24));
    document.getElementById('clock').textContent =
      Math.floor(left / 60) + ':' + ('0' + (left % 60)).slice(-2);
    document.getElementById('moth').textContent =
      'Moth ' + (hiddenMoth / 24).toFixed(1) + 's';
    document.getElementById('owl').textContent =
      'Owl ' + (hiddenOwl / 24).toFixed(1) + 's';
    document.getElementById('turn').textContent =
      'turn ' + (state.turn + 1) + '/' + state.turns;
    draw();
  }

  function connect() {
    var scheme = location.protocol === 'https:' ? 'wss' : 'ws';
    var base = location.pathname.replace(/\/clients?\/[^/]*$/, '');
    var socket = new WebSocket(scheme + '://' + location.host + base + '/global');
    socket.onopen = function () {
      document.getElementById('status').textContent = 'live';
    };
    socket.onmessage = function (event) {
      try { render(JSON.parse(event.data)); } catch (error) { /* ignore */ }
    };
    socket.onclose = function () {
      document.getElementById('status').textContent =
        'episode over (socket closed)';
    };
    socket.onerror = function () {
      document.getElementById('status').textContent = 'socket error';
    };
  }

  window.addEventListener('resize', fit);
  fit();
  connect();
})();
</script>
</body>
</html>
